<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <title>Booked</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <script defer src="../javascript/library.js"></script>
    <script defer src="../javascript/header.js"></script>
    <link href="../css/styles.css" rel="stylesheet"> 


</head>
<body>
    <header class="custom-header text-green-900 py-4">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center" id="logoAndHome">
                <!-- Logo and Home button will be populated by header.js -->
            </div>
            <div id="userSection" class="flex items-center space-x-4">
                <!-- User Section will be populated by header.js -->
            </div>
        </div>
    </header>
    <main class="container mx-auto mt-8">
        <!-- Shown when viewing someone else's library (filled in by library.js) -->
        <section id="libraryOwnerHeader" class="library-owner-header hidden">
            <a id="ownerProfileLink" href="#">
                <img id="ownerAvatar" src="../profile.png" alt="" class="library-owner-avatar">
            </a>
            <div class="library-owner-info">
                <a id="ownerName" href="#" class="library-owner-name"></a>
                <div class="library-owner-stats">
                    <span id="ownerBookCount"></span>
                    <span id="ownerAvgRating"></span>
                </div>
            </div>
            <div id="ownerFriendStatus" class="library-owner-friend"></div>
        </section>
        <section id="currentReadsSection" class="mb-12">
            <h1 id="currentReadsTitle" class="text-3xl font-bold text-white mb-4"></h1>
            <div id="currentReadsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Current Reads will be dynamically inserted here -->
            </div>
        </section>
        <h1 id="libraryTitle" class="text-white text-3xl font-bold mb-4"></h1>
        <div>
            <label id="sortLabel" for="sortOptions" class="text-white mr-2"></label>
            <select id="sortOptions" class="px-4 py-2 rounded">
                <option value="none">Select</option>
                <option value="none">None</option>
                <option value="reviewDate">Review Date</option>
                <option value="rating">Rating</option>
            </select>
        </div>
        <div id="libraryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Book images will be dynamically inserted here -->
        </div>
        <div id="paginationControls" class="pagination-controls">
            <button id="prevPage" class="pagination-btn" disabled>&larr;</button>
            <span id="pageInfo">Page 2 of 2</span>
            <button id="nextPage" class="pagination-btn">&rarr;</button>
        </div>
        
        
        <h1 id="readListTitle" class="text-3xl font-bold text-white mb-4"></h1>
        <div id="readingListGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Book cards will be dynamically inserted here -->
        </div>
        
        <!-- Pagination Controls -->
        <div class="pagination-controls">
            <button id="prevReadingPage" class="pagination-btn px-4 py-2 bg-blue-500 text-white rounded" disabled>&larr;</button>
            <span id="readingPageInfo" class="mx-4 text-white">Page 2 of 2</span>
            <button id="nextReadingPage" class="pagination-btn px-4 py-2 bg-blue-500 text-white rounded">&rarr;</button>
        </div>
    </main>
    
    <!-- "Finished it?" prompt when ending a book in Currently Reading (filled in by library.js) -->
    <div id="finishModal" class="finish-modal hidden" role="dialog" aria-modal="true" aria-labelledby="finishHeading">
        <div class="finish-card">
            <button id="finishClose" class="finish-close" aria-label="Close">&times;</button>
            <div class="finish-book">
                <img id="finishCover" src="" alt="" class="finish-cover">
                <div>
                    <h2 id="finishHeading" class="finish-heading">Finished <em id="finishTitle"></em>?</h2>
                    <p class="finish-subtitle">Rate and review it, and it goes into your library.</p>
                </div>
            </div>
            <label for="finishRating" class="finish-label">Rating: <span id="finishRatingValue">not rated</span></label>
            <input type="range" id="finishRating" min="0" max="100" value="50" class="finish-range">
            <label for="finishReview" class="finish-label">Review <span class="finish-optional">(optional)</span></label>
            <textarea id="finishReview" rows="4" class="finish-textarea" placeholder="What did you think?"></textarea>
            <label for="finishVisibility" class="finish-label">Who can see it</label>
            <select id="finishVisibility" class="finish-select">
                <option value="public">Everyone</option>
                <option value="friends">Friends</option>
                <option value="private">Only me</option>
            </select>
            <div class="finish-actions">
                <button id="finishSave" class="finish-primary">Add to library</button>
                <button id="finishNoReview" class="finish-secondary">Add without a review</button>
                <button id="finishDidNotFinish" class="finish-link">I didn't finish it</button>
            </div>
            <p id="finishMessage" class="finish-message" role="status"></p>
        </div>
    </div>
    <div id="reviewModal" class="reviewmodal">
        <div class="modal-content">
            <span class="close-button" id="closeModal">&times;</span>
            <h2>Review</h2>
            <p id="reviewDate" class="text-gray-500 text-sm"></p> <!-- This line displays the review date -->
            <textarea id="reviewText" placeholder="Add a review..."></textarea>
            <div class="visibility-container mt-4">
                <label for="visibility">Visibility:</label>
                <select id="visibility" name="visibility">
                    <option value="public">Public</option>
                    <option value="friends">Friends</option>
                    <option value="private">Private</option>
                </select>
            </div>
            <div class="rating-container">
                <label for="rating">Rating:</label>
                <input type="range" id="rating" name="rating" min="0" max="100">
                <span id="ratingValue">50</span>
            </div>
            <button id="saveReview">Save</button>
        </div>
    </div>

</body>

</html>
